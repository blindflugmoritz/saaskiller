# ═══════════════════════════════════════════════════════════════════════════
#  SaasKiller — setup.config.ini  (example / template)
# ═══════════════════════════════════════════════════════════════════════════
#
#  Pre-answer setup.sh's questions so you don't have to type them every time.
#
#  Usage:
#      ./setup.sh my-project --config setup.config.ini
#
#  Behaviour:
#    - Every key you set here is used verbatim and its question is skipped.
#    - Every key you OMIT is asked interactively as usual (the safe default).
#    - Pass --non-interactive to instead use the documented default for any
#      omitted key and abort if a required key (project_name) is missing.
#
#  Format:
#    - key = value      (spaces around = optional; section headers optional)
#    - booleans: true/false, yes/no, y/n, 1/0
#    - comments: whole lines starting with # or ;  AND inline comments after a
#      value ( key = value   # like this ) — a space before # or ; is required,
#      so a '#' inside a value (e.g. a URL fragment) is preserved.
#    - keys are case-insensitive; section headers are cosmetic (ignored by
#      the parser) but keep the file readable.
#
#  The authoritative list of keys/values lives in setup.spec.json.
#  A full human guide is in SETUP_CONFIG.md.
# ═══════════════════════════════════════════════════════════════════════════


[project]
# Lowercase letters, digits, hyphen, underscore only.
# Usually you pass this as the first CLI arg instead (./setup.sh my-project ...),
# in which case this value is ignored. Set it here for a fully self-contained config.
project_name = modell-cockpit


[features]
# Turn each optional feature on (true) or off (false). Anything false is
# stripped from the fork (apps, deps, routes, package.json scripts).

workspaces   = false   # multi-user teams/tenants
cms          = false   # feincms3 pages/blog + Svelte islands
stripe       = false   # billing & payments
tasks        = true    # django-q2 background tasks (action runner)
websockets   = true    # django-channels realtime (live progress)
s3           = true    # file uploads (default: nine.ch S3 — reconfigure to local FS if needed)
i18n         = false   # Paraglide multilingual (de/en); false = hardcoded strings ok
sentry       = false   # Sentry error monitoring (needs network)
apikeys      = false   # programmatic API key management
github_oauth = false   # GitHub OAuth as a second login provider
mobile       = false   # Capacitor mobile wrapper
feedloop     = false   # Feedloop feedback widget (needs ~/coding/feedloop present)


[hosting]
# hosting: one of  deploio | pythonanywhere | none
#   deploio        = nine.ch Swiss PaaS (nctl)
#   pythonanywhere = PythonAnywhere
#   none           = local only, no deploy files generated
hosting    = none

# Only relevant when hosting != none. If both are false, hosting falls back to none.
# On deplo.io a single environment is always named production (staging=true +
# production=false becomes production only — deplo.io apps can't be renamed).
staging    = false
production = false


[deploio]
# Only relevant when hosting = deploio. Used to generate deploy-init.sh.
github_org  =            # e.g. blindflugstudios
github_repo =            # defaults to project_name if empty
domain      =            # custom production domain, e.g. myapp.ch (empty = skip)

# Postgres on deplo.io (see SETUP_CONFIG.md "Database on deplo.io"):
#   shared         one shared DB per environment, ≈ CHF 5.50/month each (default)
#   server:<name>  DBs on an EXISTING dedicated server <name> — nothing is created
#   dedicated      a NEW dedicated server for this project alone, ≈ CHF 104/month
db          = shared


[pythonanywhere]
# Only relevant when hosting = pythonanywhere.
pa_username      =
pa_webapp_domain =       # e.g. myapp.pythonanywhere.com
pa_app_dir       =       # e.g. /home/<user>/<project>
